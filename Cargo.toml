[workspace]
resolver = "3"
members = [
    "crates/faas-core",
    "crates/faas-api",
    "crates/sandbox-process",
    "bench",
]
# Phase -1 の練習コードは本体と切り離す
exclude = ["experiments/oslearn"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
faas-core = { path = "crates/faas-core" }
sandbox-process = { path = "crates/sandbox-process" }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
